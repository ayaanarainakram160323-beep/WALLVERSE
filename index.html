<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090f">
  <title>WALLYZA — Wallpaper Universe</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #09090f;
      color: white;
    }

    header {
      text-align: center;
      padding: 35px 15px 25px;
      background: linear-gradient(135deg, #17132d, #10101a);
    }

    header h1 {
      font-size: clamp(38px, 7vw, 65px);
      margin: 0;
      letter-spacing: 4px;
      color: #a78bfa;
    }

    header p {
      color: #c7c7d5;
    }

    .search-box {
      display: block;
      width: min(90%, 550px);
      margin: 20px auto;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #39394c;
      background: #171722;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .search-box:focus {
      border-color: #a78bfa;
    }

    #categories {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 15px 25px;
    }

    button {
      padding: 10px 16px;
      border: 1px solid #39394c;
      border-radius: 20px;
      background: #171722;
      color: white;
      cursor: pointer;
    }

    button:hover,
    button.active {
      background: #8b5cf6;
      border-color: #8b5cf6;
    }

    main {
      padding: 10px 20px 40px;
      max-width: 1500px;
      margin: auto;
    }

    #heading {
      margin-bottom: 20px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(210px, 1fr)
      );
      gap: 20px;
    }

    .wall {
      background: #171722;
      border: 1px solid #29293b;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .wall:hover {
      transform: translateY(-4px);
    }

    .wall img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      background: #252536;
    }

    .wall-info {
      padding: 14px;
    }

    .wall-info h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .wall-info small {
      color: #aaaac0;
    }

    .wall-info a {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 13px;
      border-radius: 8px;
      background: #8b5cf6;
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .wall-info a:hover {
      background: #7041dc;
    }

    #message {
      color: #c7c7d5;
      text-align: center;
      padding: 30px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #85859a;
    }
  </style>
</head>

<body>
  <header>
    <h1>WALLYZA</h1>
    <p>Your world. Your wallpaper. Your vibe. ✨</p>
  </header>

  <input
    id="search"
    class="search-box"
    type="search"
    placeholder="🔍 Search cars, bikes, gaming, nature..."
    aria-label="Search wallpapers"
  >

  <nav id="categories" aria-label="Wallpaper categories"></nav>

  <main>
    <h2 id="heading">Explore Wallpapers</h2>
    <section id="grid"></section>
    <p id="message" hidden>No wallpapers found. Try another search!</p>
  </main>

  <footer>
    WALLYZA © 2026 · Find your next wallpaper.
  </footer>

  <script>
    const photos = [
      {
        category: "Tech",
        name: "Futuristic Technology",
        id: "photo-1518770660439-4636190af475"
      },
      {
        category: "Gaming",
        name: "Gaming Setup",
        id: "photo-1593305841991-05c297ba4575"
      },
      {
        category: "Cars",
        name: "Luxury Sports Car",
        id: "photo-1503376780353-7e6692767b70"
      },
      {
        category: "Cars",
        name: "Sports Car",
        id: "photo-1492144534655-ae79c964c9d7"
      },
      {
        category: "Cars",
        name: "Classic Car",
        id: "photo-1503736334956-4c8f8e92946d"
      },
      {
        category: "Planes",
        name: "Aircraft",
        id: "photo-1436491865332-7a61a109cc05"
      },
      {
        category: "Planes",
        name: "Jet in the Sky",
        id: "photo-1474302770737-173ee21bab63"
      },
      {
        category: "Bikes",
        name: "Motorcycle",
        id: "photo-1558981806-ec527fa84c39"
      },
      {
        category: "Bikes",
        name: "Racing Bike",
        id: "photo-1558981403-c5f9899a28bc"
      },
      {
        category: "Nature",
        name: "Dreamy Landscape",
        id: "photo-1470770841072-f978cf4d019e"
      },
      {
        category: "Nature",
        name: "Mountain Escape",
        id: "photo-1464822759023-fed622ff2c3b"
      },
      {
        category: "Space",
        name: "Galaxy",
        id: "photo-1462331940025-496dfbfc7564"
      },
      {
        category: "Aesthetic",
        name: "Neon Night",
        id: "photo-1519608487953-e999c86e7455"
      },
      {
        category: "Animals",
        name: "Wildlife",
        id: "photo-1472396961693-142e6e269027"
      },
      {
        category: "Architecture",
        name: "Modern Architecture",
        id: "photo-1487958449943-2429e8be8625"
      },
      {
        category: "Nature",
        name: "Ocean Views",
        id: "photo-1507525428034-b723cf961d3e"
      },
      {
        category: "Tech",
        name: "Computer Technology",
        id: "photo-1519389950473-47ba0277781c"
      },
      {
        category: "Aesthetic",
        name: "Minimalist Mood",
        id: "photo-1494438639946-1ebd1d20bf85"
      },
      {
        category: "Gaming",
        name: "Gaming Gear",
        id: "photo-1542751371-adc38448a05e"
      },
      {
        category: "Nature",
        name: "Forest Adventure",
        id: "photo-1448375240586-882707db888b"
      }
    ];

    let selectedCategory = "All";

    const categories = [
      "All",
      "Cars",
      "Bikes",
      "Tech",
      "Gaming",
      "Nature",
      "Space",
      "Planes",
      "Animals",
      "Aesthetic",
      "Architecture"
    ];

    const categoryBox = document.getElementById("categories");
    const search = document.getElementById("search");
    const grid = document.getElementById("grid");
    const heading = document.getElementById("heading");
    const message = document.getElementById("message");

    categories.forEach(function(category) {
      const button = document.createElement("button");
      button.textContent = category;
      button.className =
        category === selectedCategory ? "active" : "";

      button.addEventListener("click", function() {
        selectedCategory = category;

        document.querySelectorAll("#categories button")
          .forEach(function(item) {
            item.classList.toggle(
              "active",
              item.textContent === category
            );
          });

        render();
      });

      categoryBox.appendChild(button);
    });

    function render() {
      const query = search.value.trim().toLowerCase();

      const results = photos.filter(function(photo) {
        const matchesCategory =
          selectedCategory === "All" ||
          photo.category === selectedCategory;

        const matchesSearch =
          (photo.name + " " + photo.category)
            .toLowerCase()
            .includes(query);

        return matchesCategory && matchesSearch;
      });

      heading.textContent =
        selectedCategory === "All"
          ? "Explore Wallpapers"
          : selectedCategory + " Wallpapers";

      grid.innerHTML = "";
      message.hidden = results.length !== 0;

      results.forEach(function(photo) {
        const url =
          "https://images.unsplash.com/" + photo.id +
          "?auto=format&fit=crop&w=900&q=85";

        const card = document.createElement("article");
        card.className = "wall";

        const img = document.createElement("img");
        img.src = url;
        img.alt = photo.name;
        img.loading = "lazy";

        const info = document.createElement("div");
        info.className = "wall-info";

        const name = document.createElement("h3");
        name.textContent = photo.name;

        const category = document.createElement("small");
        category.textContent = photo.category;

        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "View / Download";

        info.append(name, category, document.createElement("br"), link);
        card.append(img, info);
        grid.appendChild(card);
      });
    }

    search.addEventListener("input", render);

    render();
  </script>
</body>
</html>
