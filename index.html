<!DOCTYPE html>
<html lang="en">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080b14">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WALLYZA</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #090b12;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  padding: 22px 18px;
  background: #111521;
  border-bottom: 1px solid #252a3b;
}
h1 { margin: 0; color: #8c7bff; }
header p { color: #a9aec2; }
main { padding: 18px; max-width: 1100px; margin: auto; }
input {
  width: 100%; padding: 14px;
  border: 1px solid #343950;
  border-radius: 12px;
  background: #171b29; color: white;
}
.categories {
  display: flex; gap: 9px; flex-wrap: wrap;
  margin: 18px 0;
}
button {
  background: #1b2030; color: white;
  border: 1px solid #363c54;
  border-radius: 20px; padding: 10px 14px;
  cursor: pointer;
}
button.active { background: #7565f5; }
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 13px;
}
.wall {
  overflow: hidden; background: #151927;
  border-radius: 14px; border: 1px solid #282e40;
}
.wall img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
.wall div { padding: 10px; }
.wall p { margin: 0 0 10px; font-weight: bold; }
.wall a {
  display: inline-block; background: #7565f5;
  padding: 9px 12px; border-radius: 9px;
  color: white; text-decoration: none; font-size: 13px;
}
@media(min-width:650px) {
  .grid { grid-template-columns: repeat(4,minmax(0,1fr)); }
}
</style>
</head>
<body>
<header>
  <h1>✦ WALLYZA</h1>
  <p>Your screen. Your style. Your universe.</p>
</header>
<main>
  <input id="search" placeholder="Search cars, tech, planes..."
  oninput="render()">
  <div class="categories" id="categories"></div>
  <h2 id="heading">Explore wallpapers</h2>
  <div class="grid" id="grid"></div>
</main>
<script>
const photos = [
  ["Tech","Futuristic Tech","photo-1518770660439-4636190af475"],
  ["Tech","Gaming Setup","photo-1593305841991-05c297ba4575"],
  ["Cars","Supercar","photo-1503376780353-7e6692767b70"],
  ["Cars","Sports Car","photo-1492144534655-ae79c964c9d7"],
  ["Planes","Aircraft","photo-1436491865332-7a61a109cc05"],
  ["Planes","Jet in the Sky","photo-1474302770737-173ee21bab63"],
  ["Bikes","Motorcycle","photo-1558981806-ec527fa84c39"],
  ["Bikes","Racing Bike","photo-1558981403-c5f9899a28bc"],
  ["Aesthetic","Dreamy Landscape","photo-1470770841072-f978cf4d019e"],
  ["Aesthetic","Mountain Escape","photo-1464822759023-fed622ff2c3b"],
  ["Tech","Neon City","photo-1519608487953-e999c86e7455"],
  ["Cars","Classic Car","photo-1503736334956-4c8f8e92946d"]
];
let category = "All";
const cats = ["All","Tech","Cars","Planes","Bikes","Aesthetic"];
const categories = document.getElementById("categories");
cats.forEach(c => {
  const b = document.createElement("button");
  b.textContent = c;
  b.className = c === category ? "active" : "";
  b.onclick = () => {
    category = c;
    [...categories.children].forEach(x =>
      x.classList.toggle("active", x.textContent === c));
    render();
  };
  categories.appendChild(b);
});
<div class="wallpaper-grid" id="gallery"></div>

<style>
.wallpaper-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 18px;
}

.wallpaper-card {
  overflow: hidden;
  border-radius: 14px;
  background: #171923;
  color: white;
  padding-bottom: 12px;
}

.wallpaper-card img {
  display: block;
  width: 100%;
  height: 260px;
  object-fit: cover;
}

.wallpaper-card h3 {
  margin: 12px;
  font-size: 16px;
}

.wallpaper-card a {
  display: inline-block;
  margin: 0 12px;
  color: #9eafff;
}
</style>

<script>
const wallpapers = [
  {
    name: "BMW M4",
    category: "Cars",
    image: "PASTE_THE_BMW_IMAGE_URL_HERE"
  },
  {
    name: "Kawasaki Ninja",
    category: "Bikes",
    image: "PASTE_THE_KAWASAKI_IMAGE_URL_HERE"
  },
  {
    name: "Mountain Landscape",
    category: "Nature",
    image: "PASTE_THE_MOUNTAIN_IMAGE_URL_HERE"
  },
  {
    name: "Gaming Setup",
    category: "Tech",
    image: "PASTE_THE_GAMING_IMAGE_URL_HERE"
  },
  {
    name: "Pastel Aesthetic",
    category: "Aesthetic",
    image: "PASTE_THE_AESTHETIC_IMAGE_URL_HERE"
  },
  {
    name: "Passenger Airplane",
    category: "Planes",
    image: "PASTE_THE_PLANE_IMAGE_URL_HERE"
  }
];

function renderWallpapers(items = wallpapers) {
  const gallery = document.getElementById("gallery");

  gallery.innerHTML = items.map((wallpaper) => `
    <article class="wallpaper-card">
      <img
        src="${wallpaper.image}"
        alt="${wallpaper.name}"
        loading="lazy"
      >
      <h3>${wallpaper.name}</h3>
      <a href="${wallpaper.image}" download>
        Download
      </a>
    </article>
  `).join("");
}

renderWallpapers();
</script>
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("WALLYZA app is ready!"))
        .catch((error) => console.error("Service worker error:", error));
    });
  }
</script>
</body>
</html>
