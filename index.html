.info{padding:13px}
.info h3{margin:0 0 8px;font-size:17px}
.tag{font-size:13px;color:#bca5ff}
.info a{display:inline-block;margin:13px 6px 0 0;background:#8757f5;color:white;text-decoration:none;padding:10px 13px;border-radius:8px;font-size:14px}

const categories = [...new Set(photos.map(p=>p[0]))];
const subcategories = [...new Set(photos.map(p=>p[1]))];
const categoryNames = ["All Wallpapers",...categories,...subcategories];

let selected = "All Wallpapers";
const nav = document.getElementById("categories");
const grid = document.getElementById("grid");
const search = document.getElementById("search");
const heading = document.getElementById("heading");
const count = document.getElementById("count");
const message = document.getElementById("message");

categoryNames.forEach(name=>{
  const button=document.createElement("button");
  button.textContent=name;
  button.className=name===selected?"active":"";
  button.addEventListener("click",()=>{
    selected=name;
    nav.querySelectorAll("button").forEach(b=>
      b.classList.toggle("active",b.textContent===name));
    render();
  });
  nav.appendChild(button);
});

function render(){
  const query=search.value.trim().toLowerCase();
  const results=photos.filter(photo=>{
    const categoryMatches=selected==="All Wallpapers"||
      photo[0]===selected||photo[1]===selected;
    const searchMatches=(photo[0]+" "+photo[1]).toLowerCase().includes(query);
    return categoryMatches&&searchMatches;
  });

  heading.textContent=selected==="All Wallpapers"
    ?"Explore All Wallpapers":selected+" Wallpapers";
  count.textContent=results.length+" wallpapers shown";
  grid.replaceChildren();
  message.hidden=results.length!==0;

  results.forEach((photo,index)=>{
    const url="https://images.unsplash.com/"+photo[2]+
      "?auto=format&fit=crop&w=900&q=85";

    const card=document.createElement("article");
    card.className="card";

    const img=document.createElement("img");
    img.src=url;
    img.alt=photo[1];
    img.loading="lazy";
    img.onerror=()=>{
      img.onerror=null;
      img.alt="Wallpaper unavailable";
      img.src="data:image/svg+xml,"+encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="350"><rect width="100%" height="100%" fill="#292638"/><text x="50%" y="48%" fill="white" font-size="18" text-anchor="middle">Image unavailable</text><text x="50%" y="57%" fill="#bca5ff" font-size="13" text-anchor="middle">Try another wallpaper</text></svg>'
      );
    };

    const info=document.createElement("div");
    info.className="info";
    const title=document.createElement("h3");
    title.textContent=photo[1];
    const tag=document.createElement("div");
    tag.className="tag";
    tag.textContent=photo[0];

    const view=document.createElement("a");
    view.href=url;
    view.target="_blank";
    view.rel="noopener";
    view.textContent="View Image";

    const download=document.createElement("a");
    download.href=url;
    download.download=photo[1].replace(/[^a-z0-9]+/gi,"-")+".jpg";
    download.textContent="Download";
    download.addEventListener("click",event=>{
      event.preventDefault();
      fetch(url).then(response=>{
        if(!response.ok)throw new Error("Download failed");
        return response.blob();
      }).then(blob=>{
        const blobUrl=URL.createObjectURL(blob);
        const link=document.createElement("a");
        link.href=blobUrl;
        link.download=photo[1].replace(/[^a-z0-9]+/gi,"-")+".jpg";
        link.click();
        setTimeout(()=>URL.revokeObjectURL(blobUrl),1000);
      }).catch(()=>window.open(url,"_blank","noopener"));
    });

    info.append(title,tag,view,download);
    card.append(img,info);
    grid.appendChild(card);
  });
}

search.addEventListener("input",render);
render();
